# Intended differences from the last release, for the release parity check.
#
# When a change is MEANT to alter what a client sees (a new tool, a reworded
# description, a renamed argument, a different answer to a golden call), the
# parity check fails and its summary lists each difference by path. Add an entry
# here with the release it differs from and one plain-English reason. An entry
# only applies while the baseline is the release it names, so after the next
# release these stop applying and can be deleted.
#
# Release 0.2.2 shipped FastMCP 3.4.7. Main now runs FastMCP 4.2.0 (with mcp
# 2.3.0). No tool body or docstring changed; the framework upgrade alone changes
# what a client sees, which this check surfaced on its first run.

changes:
  - change: tools.get_audio.title
    baseline: 0.2.2
    reason: FastMCP 4 derives a display title from the tool name; FastMCP 3.4.7 sent none.
